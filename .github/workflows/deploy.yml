name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Make Maven Wrapper executable & build package with the GitHub token baked in
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -Dgithub.token=${{ secrets.GH_ACCESS_TOKEN }}

      # 4. Copy built WAR directly to EC2 home directory
      - name: Copy target file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.200.43.90
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/Jira-0.0.1-SNAPSHOT.war"
          target: "/home/ec2-user/"
          strip_components: 1

      # 5. Clear old PM2 process and start the fresh build
      - name: Restart Application via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.200.43.90
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pm2 delete jira-backend || true
            cd /home/ec2-user
            pm2 start java --name "jira-backend" -- -jar /home/ec2-user/Jira-0.0.1-SNAPSHOT.war
            pm2 save
