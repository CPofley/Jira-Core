name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Make Maven Wrapper executable & build package without running tests
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. Copy built WAR to EC2 via SCP
      - name: Copy target file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.204.130.37.nip.io
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/"
          strip_components: 1

      # 5. Restart or Start Application via PM2 with Dynamic WAR Detection & Token Injection
      - name: Restart Application via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.204.130.37.nip.io
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pm2 delete jira-backend || true
            
            # Find the actual WAR filename dynamically inside target/
            WAR_FILE=$(ls /home/ec2-user/target/*.war | head -n 1)
            echo "Using WAR file: $WAR_FILE"
            
            # Generate ecosystem config dynamically with the correct absolute WAR path & GitHub Token
            cat <<EOF > /home/ec2-user/ecosystem.config.js
            module.exports = {
              apps: [{
                name: "jira-backend",
                script: "java",
                args: ["-jar", "$WAR_FILE"],
                env: {
                  GITHUB_TOKEN: "${{ secrets.GH_ACCESS_TOKEN }}"
                }
              }]
            };
            EOF
            
            cd /home/ec2-user
            pm2 start ecosystem.config.js
            pm2 save
