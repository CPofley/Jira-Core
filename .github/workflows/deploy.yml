name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Make Maven Wrapper executable & build package without running tests
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. Copy built WAR and Ecosystem Config to EC2 via SCP
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.204.130.37.nip.io
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.war, ecosystem.config.js"
          target: "/home/ec2-user/"
          strip_components: 1

      # 5. Restart or Start Application via PM2 using the Ecosystem Config
      - name: Restart Application via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.204.130.37.nip.io
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export GITHUB_TOKEN="${{ secrets.GH_ACCESS_TOKEN }}"
            
            if pm2 describe jira-backend > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save
